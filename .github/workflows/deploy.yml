name: Deploy Storefront to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Storefront via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy App via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            # Load NVM so npm and pm2 commands work in this non-interactive shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 1. Sync store working tree to latest main
            cd /home/orbit_software/store
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            git reset --hard FETCH_HEAD --
            git clean -fd
            echo "Current Storefront Commit:"
            git log -1 --oneline

            # 2. Install dependencies & build Next.js application
            echo "Building Storefront App..."
            rm -rf .next
            npm install
            npm run build

            # 3. Reload storefront process in PM2
            echo "Reloading PM2 Storefront (client)..."
            pm2 reload client || pm2 restart client || (cd /home/orbit_software/server && pm2 startOrReload pm2.config.js --only client)
            pm2 save || true
